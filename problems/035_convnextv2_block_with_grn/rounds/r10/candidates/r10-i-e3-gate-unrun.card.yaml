hypothesis: >-
  H43 (lineage I seed). Not tested: the B200 Modal function was stopped for the whole session, so every probe_b200
  and compile_b200 call failed and no GPU measurement exists. The shipped code is the unchanged r0 anchor on all 16
  rows. The STEP 1 gate kernel is a bulk-staged, register-blocked conv with padded rows and fp16 d written into the
  SW128 B layout. It is kept disabled in i_gate_conv.cu for the next lineage-I session, which should run STEP 1 first.
