risks:
  - "Only 32,768 clearly beats the parent; the other tc-row deltas (<= 0.8 us) are within portal noise"
  - "MP=2 is MMA-heavier per stage (8 N=256 MMAs); at the portal's 1.5 GHz the MMA term stretches by ~1.3x, so the portal gain at 32,768 may be smaller than the L2-bound rented gain suggests"
  - "The CTA exits after cp.async.bulk.wait_group.read (the CUTLASS tma_store_wait form), not after a full completion wait; 16/16 x 10 rounds and the portal-order re-runs pass"
  - "STACK was checked on a probe build of the identical tc_kernel device code, not on the run_tests binary; sc/tc2 are unchanged and were not re-checked"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
