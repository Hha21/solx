hypothesis: >-
  H46 (lineage J, E3): cluster split-K cells for 2,768 / 8,768 fill 144 CTAs and cut both GEMM mainloops,
  with partials reduced inside the cluster before the GELU and the residual store. STEP 0 refuted it before
  any build. On B200, clusters of 3 or more fit only 120-135 co-resident CTAs (not 144). Exchanging a
  50 KB fp32 partial inside a cluster costs 1.63-2.11 us per CTA by the best route (DSMEM pull), over the
  1.5 us kill line; 100 KB costs 2.7-3.0 us. The candidate is the r0 anchor unchanged, a placeholder that
  carries the findings. It must not take any merge row.
