    red.add 6.82'
  - 'r1-b-e2-fanout-v3 run_tests: 1,28,28 11.6, 8,14,14 13.7, 4,28,28 16.5, 16,14,14 16.7 us rented; both success lines missed,
    the 12 us refutation line not reached; portal 14.7/17.0/21.0/21.4'
  - 'critic r2: red.add v4 adds ~0.3 us over plain stores at 1.6 MB; global barrier 1.2 us'
- id: H12
