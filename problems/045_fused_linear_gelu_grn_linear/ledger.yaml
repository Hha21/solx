- id: H16
  statement: 'Cross-CTA sync costs: a global red.release + ld.acquire barrier over 128-148 CTAs costs ~1.2 us; a cluster-8
    barrier with a 2 KB DSMEM exchange ~0.45 us. Moving a GRN crossing into a cluster saves <= ~0.75 us per crossing.'
  status: supported
  evidence:
  - 'critic r2 probe: 20 back-to-back barriers, globaltimer: 1.20 us (128 CTAs), 1.22 us (148), cluster-8 0.45 us; start spread
    0.03-0.06 us'
- id: H17
  statement: 'Cluster capacity on B200 at 512 threads and >=180 KB dynamic smem: cluster-2 74 (148 SMs), cluster-4 33 (132),
    cluster-8 15 (120), cluster-16 7 (112). Only pairs are free of SM loss for 1-CTA/SM designs.'
  status: supported
