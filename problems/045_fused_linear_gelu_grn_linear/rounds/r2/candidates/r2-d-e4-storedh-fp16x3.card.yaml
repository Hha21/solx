risks:
  - "Never compiled: PTX syntax (mbarrier.arrive.relaxed, 3-D TMA), descriptor or idesc errors, or register overflow at 544/576 threads (cap 120/112 regs) may need a repair pass"
  - "K2 smem leaves only 576 B of slack: if the dynamic smem base is not 1024-aligned the kernel traps (it does not corrupt memory)"
  - "Correctness hazards: TMEM double-buffer parities, the segment and W2' rebuild handshake (wfull/wfree), and the K1 converter's single x buffer; any deadlock shows as a timeout on the L rows"
  - "Epilogue-bound K1: gelu2 is MUFU-bound at ~4.1k clk per 128x256 unit vs ~6.5k clk per unit at the DRAM rate; any extra epilogue cost goes straight onto the critical path"
  - "Precision: GEMM1 uses one fp32 accumulator with unscaled lo (critic err/tol 0.25); GEMM2 uses a separate 2^11-scaled cross accumulator (0.44). The fold of s into W2' is untested on hardware"
measure_first: [B200]
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
