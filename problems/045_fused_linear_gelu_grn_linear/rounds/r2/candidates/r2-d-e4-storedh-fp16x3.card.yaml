tests: [H20]
findings:
  - "infrastructure: the step-0 skeleton probe (K1 x->h 2 KB/token, K2 h->out, 4 L shapes) got no response for 1800 s; that wait used up the round's 20-min B200 budget. The retried probe and compile_b200 both returned 'B200 budget used up'. Nothing in this card was compiled, run or timed; the H20 kill line (skeleton > 200 us at 64,56,56) is still untested [probe_b200, compile_b200]"
  - "rules: the task asked for K2 via PDL, but the operator note forbids PDL, so K2 is a plain second launch on the same stream; expect one kernel-to-kernel gap plus a second ramp (~2-5 us) [INFERRED]"
  - "design: batch-aligned 128-token tiles (TB = ceil(HW/128) per batch) remove straddling tiles. Sumsq partials are per (tile, 64-token column half, channel), written with plain stores, so no atomics, counters or zero-fill are needed. MMA waste is 2% at HW 3136 and 12.5% at HW 784; K2's 3-D tensor map ([B][HW][512] fp16) zero-fills rows past HW, so no h bytes are wasted [INFERRED]"
  - "design: K1 swap-AB with W1 rows permuted (M block 0 = even, block 1 = odd channels of the CTA's half) gives each epilogue thread an adjacent channel pair. h hi/lo then go out as packed half2 STG.32 with full 128-B lines per warp, and gelu2's packed ss2 is the per-channel sumsq directly [INFERRED]"
  - "design: h stored as fp16 hi + 2^11-scaled lo of unscaled h (same 2 KB/token as fp32). The GRN scale s_b is folded into W2'_b = W2 (.) s_b (hi + 2^11 lo, 128 KB per output half) and gb into bias' = b2 + W2.gb, so K2's hot loop is pure TMA -> MMA with separate main and cross accumulators [INFERRED]"
  - "design arithmetic: smem K1 = W1 hi/lo 128 KB + x hi/lo 64 KB (x is converted from a register prefetch; there is no room for a 64 KB fp32 staging tile); K2 = W2' 128 KB + 3 x 32 KB ring + 2.3 KB = 231.9 KB of the 232448 B maximum, which requires a 1024-aligned dynamic smem base (a trap guards it) [INFERRED]"
  - "cost of the out-half split: both CTAs of a pair read the same h tile (4 KB/token of L2->SM, 2 KB/token of DRAM if L2 dedups) and each batch change costs a ~2-3 us W2' rebuild (1-2 per CTA at HW 3136, up to 3-4 at HW 784). cta_group::2 pairs (M=256, each SM holding half of W2') are the natural next step to halve h ingest and give full 128-out rows [INFERRED]"
  - "owed before shipping: compile_b200 (regs, cuobjdump STACK 0, SASS), run_tests on all rows interleaved with r1-merge, the 10-round fp64 err/tol log for the L rows (gate <= 0.8), and the step-0 skeleton timing [none]"
paths:
  - {max_tokens: 25087, lang: cuda, width: 128, threads: 256, rows: 64, grid: oneshot, mem: ldg, launches: 3, st: none}
  - {max_tokens: null, lang: cuda, width: 128, threads: 576, rows: 128, grid: persistent, mem: tma, wstat: true, launches: 2, prefetch: true, x: none, w: none, st: none, cluster: 1}
