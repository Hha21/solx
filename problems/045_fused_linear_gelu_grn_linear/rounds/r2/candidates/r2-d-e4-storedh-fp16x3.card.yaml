hypothesis: >-
  Lineage D, H20. Crossing GRN through memory with two plain tcgen05 FP16x3 launches puts the L rows near the
  stored-h DRAM floor (x 0.5 + h 2 + h 2 + out 0.5 KB/token, ~146 us at 64,56,56 at 7.05 TB/s). Weight halves stay
  resident in smem (K1: W1 hidden half by CTA parity; K2: per-batch folded W2'_b output half). The 87 us of MMA and
  the ~58 us gelu2 epilogue overlap the stream through double-buffered TMEM. K2 reads h newest-first, so the tail
  of K1's h may still be in L2 (rows up to 32,28,28 almost entirely).
  UNCOMPILED AND UNMEASURED: the round's B200 budget ran out before any compile, probe or test ran.
