id: r1-a-e4-rounds-tmem
parents: []
operation: new_design
language: cuda_cpp
niche:
  mem: bulk1d
  st: direct
  grid: persistent
  launch: fused
  tile: rows128
  red: cta
  cache: default
  spec: all
hypothesis: >-
  At L, persistent rounds that hold whole batches only (18816 tokens = 147 tiles of 128 at every HW) keep fp32 h in
  TMEM across per-batch GRN counters. With FP16x3 tcgen05 swap-AB GEMMs (8.2 us of MMA per round) and a block-pipelined
  GELU epilogue, a round should take <= 15 us, so 64,56,56 <= 170 us rented, without h ever leaving the SM.
  UNMEASURED: no compile or run result was obtained in this session.
expected_effect:
  S: {pct: -85, confidence: low}
  M: {pct: -88, confidence: low}
  L: {pct: -85, confidence: low}
resources_sm100a:
  regs_per_thread: 112
  smem_per_cta_bytes: 230912
  threads_per_cta: 576
  ctas_per_sm: 1
  bytes_in_flight_per_sm: 98304
  launches_per_call: 1
knobs: {TILE: 128, NSTAGE: 3, STAGE_BYTES: 32768, ROUND_TOKENS_MAX: 18944, epilogue_warps: 16}
tests: [H13, H4, H8]
findings:
  - "tooling: probe_b200 and get_kernel each went 1800 s without a response, and the session ended before compile_b200 returned; this kernel is NOT compiled, NOT correctness-tested and NOT timed [session log]"
  - "arithmetic: 18816 = 96*196 = 24*784 = 6*3136 = 147*128, so batch-aligned rounds have no partial tile except in the last round, at every workload HW, and every tile touches at most 2 batches (HW >= 196 > 128) [inferred]"
  - "design: the GEMM1 epilogue is split by hidden block (warp group hb owns block hb, all 128 tokens), so each thread owns one hidden channel: sumsq needs no cross-thread reduction (1-2 red.add per thread per round), and block hb's GELU overlaps the MMAs of blocks hb+1.. [inferred]"
  - "design: the TMEM budget is met by placing the GEMM2 main (cols 0-127) and cross (cols 128-255) accumulators over h blocks 0/1 once they are converted to smem hi/lo; blocks 2/3 reuse the two 64 KB h' buffers after commit-tracked pfree barriers [inferred]"
  - "smem: X hi/lo 64 KB (reused as h' buffer 0) + h' buffer 1 64 KB + 3 x 32 KB weight ring = 224 KB; per round 16 bulk copies of 32 KB = 512 KB of L2 weight reads per CTA, about 3.7 us at ~140 GB/s/SM, hidden under 8.2 us of MMA only if the ring keeps up [inferred]"
  - "risk to measure first: the GELU tail after the last GEMM1 block plus the grid-wide per-batch wait are serial in every round (TMEM is full, so the next round's GEMM1 cannot overlap); refuted if > 22 us per round [inferred]"
paths:
  - {max_tokens: 18944, lang: cuda, width: 128, threads: 576, rows: 128, grid: persistent, mem: tma, wstat: false, launches: 1, prefetch: true, x: none, w: none, st: none, cluster: 1}
  - {max_tokens: null, lang: cuda, width: 128, threads: 576, rows: 128, grid: persistent, mem: tma, wstat: false, launches: 1, prefetch: true, x: none, w: none, st: none, cluster: 1}
runs_on:
  H200: {runs: false, representative: false, note: "tcgen05/TMEM are sm_100a only"}
  A100: {runs: false, representative: false}
  L40S: {runs: false, representative: false}
risks:
  - "Never compiled: syntax, register-cap (576 threads -> <=112 regs, xr[8] prefetch live across GEMM2) or spill problems are unknown"
  - "Descriptor/idesc conventions (K-major B for X with bit16=0; MN-major h' with LBO=16384) are taken from the #129 template, but the K-major-B form is new and unverified on hardware"
  - "Deadlock risk if any mbarrier parity or count is wrong (hready count 4, xready count 16); a hang would stall run_tests"
  - "S rows use only 7-49 CTAs, each streaming 512 KB of weights per round; S is not this design's target"
  - "Precision is unverified on this exact accumulation order: GEMM1 single accumulator (0.25 err/tol in emulation), GEMM2 separate cross accumulator (0.44)"
measure_first: [B200]
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
