risks:
  - "Never compiled: syntax errors, the 112-register cap at 576 threads (xr[8] prefetch live across GEMM2) and spills are unknown"
  - "K-major B descriptor for X (idesc bit16 = 0) is new relative to the #129 template and unverified on hardware; MN-major h' uses LBO = 16384"
  - "Deadlock risk if any mbarrier parity or count is wrong (hready count 4, xready count 16); a hang would stall run_tests"
  - "S rows use only 7-49 CTAs, each streaming 512 KB of weights per round; S is not this design's target"
  - "Precision unverified with this accumulation order: GEMM1 single accumulator (0.25 err/tol emulated), GEMM2 separate cross accumulator (0.44)"
measure_first:
  - B200
compliance:
  single_stream: true
  no_cross_call_state: true
  fp32_math: true
  no_threads_or_fork: true
  no_precompiled_binaries: true
